name: Build and Deploy

on: 
    push:
        branches:
            - main 

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
            
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: latest 

            - name: Install dependencies
              run: npm install
            
            - name: Build
              run: npm run build 

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                path: ./dist
    
    deploy:
        needs: build
        runs-on: ubuntu-latest

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@v5

