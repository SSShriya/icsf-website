<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>WhatsApp Channel - ICSF</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/components/site-header.ts"></script>
    <script type="module" src="/components/site-nav.ts"></script>
    <script type="module" src="/components/site-footer.ts"></script>
</head>
<body>
    <site-header subtitle="WhatsApp Channel"></site-header>
    <site-nav></site-nav>

    <main>
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAEfhPGq7Mae2tV9L"
             data-callback="onSuccess">
        </div>

        <button id="joinBtn" hidden style="height:60px;width:200px;background-color:rgba(127, 255, 185, 0.543)">Join WhatsApp Channel</button>
    </main>

    <site-footer></site-footer>

    <script>
        function buildLink() {
            const order = [3, 2, 0, 1, 4]
            const encoded = [
                'YXBwLmNvbS9',
                'LckQydG02Q2sx', 
                'jaGF0LndoYXRz', 
                'aHR0cHM6Ly9', 
                'eUFRaDJjbUZVMTVD'
            ]
            return atob(order.map(i => encoded[i]).join(''));
        }

        function onSuccess() {
            setTimeout(() => {
                const btn = document.getElementById('joinBtn');
                btn.hidden = false;
                btn.onclick = () => {
                    window.location.href = buildLink();
                };
            }, 1200);
        }
    </script>
</body>
</html>
